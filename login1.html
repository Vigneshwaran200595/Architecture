<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Architecture</title>

<style>
/* ===== GLOBAL ===== */

/* Placeholder Color White */
::placeholder {
    color: #ffffff !important;
    opacity: 1; /* Ensures full visibility */
}

/* For cross-browser support */
::-webkit-input-placeholder { color: #ffffff !important; }
:-ms-input-placeholder { color: #ffffff !important; }
::-ms-input-placeholder { color: #ffffff !important; }


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins",sans-serif;
}
body{
    height:100vh;
    background:#101215 url('img/login.webp') center/cover no-repeat;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* ===== CONTAINER ===== */
.auth-container{
    width:850px;
    height:520px;
    background:rgba(255,255,255,0.08);
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    display:flex;
    overflow:hidden;
    position:relative;
}

/* ===== LEFT PANEL ===== */
.side-panel{
    width:40%;
    background:rgba(255,255,255,0.05);
    border-right:1px solid rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    padding:40px 30px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:#fff;
}
.side-panel img{
    width:150px;
    margin-bottom:25px;
}
.side-panel h2{
    font-size:36px;
    color:#d48a42;
}
.side-panel p{
    margin-top:15px;
    opacity:0.7;
    line-height:1.6;
    max-width:260px;
}

/* ===== RIGHT SIDE FORMS ===== */
.forms-box{
    width:60%;
    position:relative;
    overflow:hidden;
}

/* HOME BUTTON */
.home-inside{
    position:absolute;
    top:20px;
    right:25px;
    background:#d48a42;
    padding:8px 16px;
    color:#fff;
    border-radius:6px;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    z-index:10;
    transition:0.3s;
}
.home-inside:hover{
    background:#b87332;
}

/* SLIDING FORMS */
.form-wrapper{
    width:300%;
    height:100%;
    display:flex;
    transition:0.6s ease-in-out;
}

form{
    width:100%;
    padding:70px 50px 50px;
    color:#fff;
    position:relative;
}
form h3{
    font-size:28px;
    margin-bottom:20px;
    color:#d48a42;
}

/* Input Fields */
input{
    width:100%;
    padding:14px;
    margin:12px 0;
    border-radius:6px;
    border:none;
    outline:none;
    background:rgba(255,255,255,0.15);
    color:#fff;
    font-size:15px;
}

/* Buttons */
button{
    width:100%;
    padding:14px;
    margin-top:10px;
    background:#d48a42;
    color:#fff;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}
button:hover{
    background:#b87332;
}

/* Switch Links */
.switch-link{
    margin-top:15px;
    display:block;
    text-align:center;
    color:#d48a42;
    cursor:pointer;
    font-weight:600;
}

/* ERROR */
.error{
    color:#ff4d4d;
    font-size:14px;
    margin-bottom:10px;
    opacity:0;
    transition:0.4s;
    font-weight:600;
}


/* ============================
   MOBILE & TABLET RESPONSIVE
=============================== */

/* For screens below 850px */
@media (max-width: 850px) {

    body {
        height: auto;
        padding: 20px 0;
        align-items: flex-start;
    }

    .auth-container {
        width: 95%;
        height: auto;
        flex-direction: column;
    }

    .side-panel {
        width: 100%;
        padding: 30px 20px;
        border-right: none;
        border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .side-panel img {
        width: 120px;
    }

    .side-panel h2 {
        font-size: 28px;
    }

    .side-panel p {
        font-size: 14px;
        max-width: 100%;
    }

    .forms-box {
        width: 100%;
    }

    .home-inside {
        top: 15px;
        right: 15px;
        padding: 6px 12px;
        font-size: 12px;
    }

    form {
        padding: 40px 25px;
    }

    form h3 {
        font-size: 22px;
    }

    input {
        padding: 12px;
        font-size: 14px;
    }

    button {
        padding: 12px;
        font-size: 15px;
    }
}

/* For very small phones (below 480px) */
@media (max-width: 480px) {

    .side-panel img {
        width: 100px;
    }

    .side-panel h2 {
        font-size: 24px;
    }

    .home-inside {
        font-size: 11px;
        padding: 5px 10px;
    }

    input {
        padding: 10px;
        font-size: 13px;
    }

    button {
        padding: 10px;
        font-size: 14px;
    }
}

.scroll-animate {
    opacity: 0;
    transform: translateY(30px);
    transition: all 2s ease-out;
}

.scroll-animate.active {
    opacity: 1;
    transform: translateY(0);
}

/* FADE IN */
.fadeIn {
    transform: none;
}

/* FADE IN UP */
.fadeInUp {
    transform: translateY(30px);
}
.fadeInUp.active {
    transform: translateY(0);
}

/* FADE IN DOWN */
.fadeInDown {
    transform: translateY(-30px);
}
.fadeInDown.active {
    transform: translateY(0);
}

/* FADE IN TOP LEFT */
.fadeInTopLeft {
    transform: translate(-30px,-30px);
}
.fadeInTopLeft.active {
    transform: translate(0,0);
}

/* FADE IN TOP RIGHT */
.fadeInTopRight {
    transform: translate(30px,-30px);
}
.fadeInTopRight.active {
    transform: translate(0,0);
}

/* FADE IN BOTTOM LEFT */
.fadeInBottomLeft {
    transform: translate(-30px,30px);
}
.fadeInBottomLeft.active {
    transform: translate(0,0);
}

/* FADE IN BOTTOM RIGHT */
.fadeInBottomRight {
    transform: translate(30px,30px);
}
.fadeInBottomRight.active {
    transform: translate(0,0);
}


</style>
</head>
<body>

<div class="auth-container">

    <!-- LEFT SIDE -->
    <div class="side-panel scroll-animate fadeInTopLeft">
        <a href="saas.html">
    <img src="img/logo.webp" alt="Logo">
</a>

        <h2>Welcome Back</h2>
        <p>Delivering innovative architectural designs that bring your vision to life.</p>
    </div>

    <!-- RIGHT SIDE -->
    <div class="forms-box scroll-animate fadeInTopRight">
        <a class="home-inside" href="saas.html">Home</a>

        <div class="form-wrapper" id="slider">

            <!-- LOGIN -->
            <form id="loginForm">
                <h3>Login</h3>
                <p class="error" id="loginError"></p>

                <input type="email" placeholder="Email" id="loginEmail">
                <input type="password" placeholder="Password" id="loginPass">

                <button type="submit">Login</button>

                <span class="switch-link" onclick="showRegister()">Create Account</span>
                <span class="switch-link" onclick="showForgot()">Forgot Password?</span>
            </form>

            <!-- REGISTER -->
            <form id="registerForm">
                <h3>Register</h3>
                <p class="error" id="regError"></p>

                <input type="text" placeholder="Full Name" id="regName">
                <input type="email" placeholder="Email" id="regEmail">
                <input type="password" placeholder="Password" id="regPass">
                <input type="password" placeholder="Confirm Password" id="regConfirmPass">

                <button type="submit">Register</button>

                <span class="switch-link" onclick="showLogin()">Already have an account?</span>
            </form>

            <!-- FORGOT -->
            <form id="forgotForm">
                <h3>Reset Password</h3>
                <p class="error" id="forgotError"></p>

                <input type="email" placeholder="Enter your email" id="forgotEmail">

                <button type="submit">Send Reset Link</button>

                <span class="switch-link" onclick="showLogin()">Back to Login</span>
            </form>

        </div>
    </div>

</div>

<script>
// Slider
function showLogin(){ slider.style.transform = "translateX(0)"; }
function showRegister(){ slider.style.transform = "translateX(-33.33%)"; }
function showForgot(){ slider.style.transform = "translateX(-66.66%)"; }

// Auto-hide error
function showError(errorBox, message){
    errorBox.textContent = message;
    errorBox.style.opacity = 1;
    setTimeout(() => { errorBox.style.opacity = 0; }, 2000);
}

// Validation
function validateForm(fields, errorBox, confirmPass = null){
    for (let f of fields){
        if (f.value.trim() === ""){
            showError(errorBox, "Please fill all the fields.");
            return false;
        }
    }

    // Email must be @gmail.com
    const emailField = fields.find(i => i.type === "email");
    if (emailField){
        let email = emailField.value.trim();
        let gmailPattern = /^[^\s@]+@gmail\.com$/;
        if (!gmailPattern.test(email)){
            showError(errorBox, "Email must be a valid @gmail.com address.");
            return false;
        }
    }

    // Password validation
    const passField = fields.find(i => i.type === "password");
    if (passField){
        let pass = passField.value;
        let uppercase = /[A-Z]/;
        let number = /[0-9]/;
        let special = /[!@#$%^&*(),.?":{}|<>]/;

        let errors = [];
        if (pass.length < 8) errors.push("8 characters");
        if (!uppercase.test(pass)) errors.push("1 uppercase letter");
        if (!number.test(pass)) errors.push("1 number");
        if (!special.test(pass)) errors.push("1 special character");

        if (errors.length > 0){
            showError(errorBox, "Password must contain: " + errors.join(", "));
            return false;
        }

        // Confirm password
        if (confirmPass && pass !== confirmPass.value){
            showError(errorBox, "Password & Confirm Password do not match!");
            return false;
        }
    }

    return true;
}

// LOGIN
loginForm.addEventListener("submit", e=>{
    e.preventDefault();
    if (validateForm([loginEmail, loginPass], loginError)){
        window.location.href = "404_1.html";
    }
});

// REGISTER
registerForm.addEventListener("submit", e=>{
    e.preventDefault();
    if (validateForm([regName, regEmail, regPass], regError, regConfirmPass)){
        window.location.href = "404_1.html";
    }
});

// FORGOT
forgotForm.addEventListener("submit", e=>{
    e.preventDefault();
    if (validateForm([forgotEmail], forgotError)){
        window.location.href = "404_1.html";
    }
});
</script>


    <script>
const elements = document.querySelectorAll(".scroll-animate");

function scrollAnimation() {
    let triggerBottom = window.innerHeight * 0.85;

    elements.forEach(el => {
        const boxTop = el.getBoundingClientRect().top;

        if (boxTop < triggerBottom) {
            el.classList.add("active");
        } else {
            el.classList.remove("active");
        }
    });
}

window.addEventListener("scroll", scrollAnimation);
scrollAnimation();
</script>


</body>
</html>
