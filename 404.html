<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found</title>

<style>
/* GLOBAL */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Poppins", sans-serif;
}
body{
    height:100vh;
    background:#0f0f0f;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:#fff;
}

/* LOGO */
.logo-box {
    position:absolute;
    top:25px;
    left:50%;
    transform:translateX(-50%);
}
.logo-box img {
    width:200px;
}

/* CONTAINER */
.container{
    text-align:center;
    max-width:650px;
    padding:20px;
    animation: fadeIn 1.4s ease-out;
}

/* 404 TEXT */
.big-404{
    font-size:80px;
    font-weight:900;
    margin-top: 50px;
    letter-spacing:5px;
    color:#d48a42;
    animation: float 3s ease-in-out infinite;
}

/* MESSAGE */
.message{
    margin-top:10px;
    font-size:22px;
    line-height:1.5;
    opacity:0.9;
}

/* HOME BUTTON */
.home-btn{
    margin-top:35px;
    padding:12px 28px;
    background:#d48a42;
    color:#fff;
    font-size:16px;
    font-weight:600;
    border-radius:6px;
    text-decoration:none;
    display:inline-block;
    transition:0.3s;
}
.home-btn:hover{
    background:#b87332;
}

/* ANIMATED ARCHITECTURE LINE */
.architecture-line{
    width:100%;
    max-width:500px;
    margin:35px;
    margin-top: -20px;
}
/* ANIMATED ARCHITECTURE LINE (Continuous) */
.architecture-line svg{
    width:100%;
    stroke:#d48a42;
    stroke-width:2;
    fill:none;
    stroke-dasharray:1200;
    stroke-dashoffset:0;
    animation: drawLoop 4s linear infinite;
}

/* Continuous line drawing */
@keyframes drawLoop {
    0%   { stroke-dashoffset:1200; }
    50%  { stroke-dashoffset:0; }
    100% { stroke-dashoffset:-1200; }
}

@keyframes fadeIn{
    from{ opacity:0; transform:translateY(20px); }
    to{ opacity:1; transform:translateY(0); }
}

@keyframes float{
    0%{ transform:translateY(0); }
    50%{ transform:translateY(-10px); }
    100%{ transform:translateY(0); }
}

/* ==========================================
        📱 MOBILE RESPONSIVE - 404 PAGE
========================================== */

/* Tablets & Medium Screens */
@media (max-width: 768px) {

    body {
        padding: 20px;
        height: auto;
    }

    .logo-box img {
        width: 160px;
    }

    .big-404 {
        font-size: 70px;
        margin-top: 80px;
    }

    .message {
        font-size: 18px;
    }

    .architecture-line {
        max-width: 350px;
        margin-top: -10px;
    }

    .home-btn {
        padding: 10px 22px;
        font-size: 15px;
    }
}

/* Small Mobile (Below 480px) */
@media (max-width: 480px) {

    .logo-box img {
        width: 140px;
    }

    .container {
        padding: 10px;
    }

    .big-404 {
        font-size: 60px;
        margin-top: 90px;
    }

    .message {
        font-size: 16px;
    }

    .architecture-line {
        max-width: 280px;
        margin-top: 0px;
    }

    .home-btn {
        padding: 9px 20px;
        font-size: 14px;
    }
}

/* Ultra Small Devices (Below 360px) */
@media (max-width: 360px) {

    .logo-box img {
        width: 120px;
    }

    .big-404 {
        font-size: 50px;
        margin-top: 100px;
    }

    .message {
        font-size: 14px;
        line-height: 1.4;
    }

    .architecture-line {
        max-width: 240px;
        margin-top: 5px;
    }

    .home-btn {
        padding: 8px 18px;
        font-size: 13px;
    }
}


</style>
</head>

<body>

<!-- LOGO -->
<div class="logo-box">
    <a href="index.html">
        <img src="img/logo.webp" alt="Logo">
    </a>
</div>

<!-- CONTENT -->
<div class="container">
    <div class="big-404">404</div>
    <p class="message">
        The page you are looking for might be removed,  
        had its name changed, or is temporarily unavailable.
    </p>

    <!-- ARCHITECTURE ANIMATION -->
    <div class="architecture-line">
        <svg viewBox="0 0 500 150">
            <path d="M10 140 L60 140 L60 80 L120 80 L120 140 L180 140 L180 100 L240 100 L240 140 
                     L300 140 L300 60 L360 60 L360 140 L420 140 L420 90 L480 90 L480 140" />
        </svg>
    </div>

    <a href="index.html" class="home-btn">Back to Home</a>
</div>

</body>
</html>
